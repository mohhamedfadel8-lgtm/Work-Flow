name: Java-App CI

on:
    workflow_dispatch:

concurrency:
  group: 'java'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: YOUR_NAME
    steps:
      - name: Get Source Code
        uses: actions/checkout@v7
        with:
          fetch-depth: '0'

      - name: Setup java v11
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: '11'

      - name: Build Java App
        run: mvn package install -DskipTests

      - name: Test Java App
        run: mvn test

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-app-jar
          path: target/*.jar

      - name: Build Docker Image
        run: docker build -t ${{ vars.IMAGE_NAME }}:v${{ github.run_number }} .

      - name: Login to Dockerhub
        run: docker login -u ${{ secrets.USERNAME }} -p ${{ secrets.PASSWD }}

      - name: Push Docker Image
        run: docker push ${{ vars.IMAGE_NAME }}:v${{ github.run_number }}