name: Dev for Java-App CI

on:
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/reusable_workflows.yaml
    with:
      image-name: 'fadel8/repo_1'
      environment: 'dev' 
    secrets:
