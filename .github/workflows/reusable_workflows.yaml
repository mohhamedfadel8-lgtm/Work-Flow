name: reusable_workflows

on:
  workflow_call:
    inputs:
      image-name:
        required: true
        type: string

      environment:
        required: true
        type: string

    secrets:
      USERNAME:
        required: true

      PASSWD:
        required: true


jobs:
  build:
    runs-on: ubuntu-latest

    environment: ${{ inputs.environment }}

    steps:

      # -------------------------
      # Show Environment Variable
      # -------------------------
      - name: Echo environment
        run: echo "${{ vars.ENVIRO_NAME }}"


      # -------------------------
      # Get Source Code
      # -------------------------
      - name: Get Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # -------------------------
      # Setup Java 11
      # -------------------------
      - name: Setup Java v11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'


      # -------------------------
      # Build Java Application
      # -------------------------
      - name: Build Java App
        run: mvn package install -DskipTests


      # -------------------------
      # Test Java Application
      # -------------------------
      - name: Test Java App
        run: mvn test


      # -------------------------
      # Build Docker Image
      # -------------------------
      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ inputs.image-name }}:v${{ github.run_number }} .


      # -------------------------
      # Login to Docker Hub
      # -------------------------
      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.PASSWD }}" | docker login \
            -u "${{ secrets.USERNAME }}" \
            --password-stdin


      # -------------------------
      # Push Docker Image
      # -------------------------
      - name: Push Docker Image
        run: |
          docker push ${{ inputs.image-name }}:v${{ github.run_number }}


      # -------------------------
      # Get CD Repository
      # -------------------------
      - name: Get CD Repo
        uses: actions/checkout@v4
        with:
          repository: mohhamedfadel8-lgtm/Java-App-CD.git
          path: cdRepo


      # -------------------------
      # Update Image Tag
      # -------------------------
      - name: Update Image Tag for CD
        run: |
          sed -i 's#^[[:space:]]*image:.*#        image: ${{ inputs.image-name }}:v${{ github.run_number }}#' \
            cdRepo/deployment.yaml


      # -------------------------
      # Commit and Push Changes
      # -------------------------
      - name: Commit and Push Changes
        run: |
          cd cdRepo

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .

          git commit -m "Update Image Tag for CD" || echo "No changes to commit"

          git push
